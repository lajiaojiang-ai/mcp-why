<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="mcp-why diagnosing a broken Claude Desktop MCP config">
  <rect width="920" height="420" rx="16" fill="#0f172a"/>
  <rect x="16" y="16" width="888" height="388" rx="12" fill="#020617"/>
  <circle cx="44" cy="44" r="6" fill="#f87171"/>
  <circle cx="64" cy="44" r="6" fill="#fbbf24"/>
  <circle cx="84" cy="44" r="6" fill="#34d399"/>
  <text x="110" y="49" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">mcp-why --config claude_desktop_config.json</text>
  <text x="36" y="96" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">mcp-why: 1 config(s), 1 server(s), 1 error(s), 1 warning(s)</text>
  <text x="36" y="140" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">[ERROR] risky_server_name</text>
  <text x="36" y="168" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Server name 'Home Assistant (ha-mcp)' contains parentheses</text>
  <text x="36" y="196" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">why: some clients silently drop every tool</text>
  <text x="36" y="224" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">fix: rename the key to letters, numbers, hyphen, underscore</text>
  <text x="36" y="268" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">[WARNING] windows_npx</text>
  <text x="36" y="296" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Server launches npx directly on Windows</text>
  <text x="36" y="324" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">fix: {"command":"cmd","args":["/c","npx","-y","..."]}</text>
  <text x="36" y="368" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">local only · no upload · never calls an MCP tool</text>
</svg>
